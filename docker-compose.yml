services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integra_sus_api
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT}
    networks:
      - integra_sus
    volumes:
      # Monta o arquivo local para persistir as alterações de cron feitas via API
      - ./sync-config.json:/app/sync-config.json
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: integra_sus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    networks:
      - integra_sus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  integra_sus:
    driver: bridge

